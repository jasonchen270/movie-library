<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${movie.id == null} ? 'Add Movie' : 'Edit Movie'">Movie Form</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<header>
  <h1>🎬 Movie Library</h1>
  <a class="btn btn-secondary" th:href="@{/movies}">← Back</a>
</header>

<div class="form-container">
  <h2 th:text="${movie.id == null} ? 'Add Movie' : 'Edit Movie'"></h2>

  <form th:action="${movie.id == null} ? @{/movies} : @{/movies/{id}(id=${movie.id})}"
        th:object="${movie}"
        method="post">

    <div class="form-group">
      <label>Title</label>
      <input type="text" th:field="*{title}" placeholder="Title"/>
      <span class="error" th:if="${#fields.hasErrors('title')}"
            th:errors="*{title}"></span>
    </div>

    <div class="form-group">
      <label>Director</label>
      <input type="text" th:field="*{director}" placeholder="Director"/>
      <span class="error" th:if="${#fields.hasErrors('director')}"
            th:errors="*{director}"></span>
    </div>

    <div class="form-group">
      <label>Year</label>
      <input type="number" th:field="*{year}" placeholder="e.g. 2001"/>
      <span class="error" th:if="${#fields.hasErrors('year')}"
            th:errors="*{year}"></span>
    </div>

    <div class="form-group">
      <label>Rating (1-10)</label>
      <input type="number" th:field="*{rating}" min="1" max="10" placeholder="1-10"/>
      <span class="error" th:if="${#fields.hasErrors('rating')}"
            th:errors="*{rating}"></span>
    </div>

    <div class="form-group">
      <label>Genre</label>
      <input type="text" th:field="*{genre}" placeholder="e.g. Action"/>
    </div>

    <div class="form-actions">
      <a class="btn btn-secondary" th:href="@{/movies}">Cancel</a>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</div>

</body>
</html>
